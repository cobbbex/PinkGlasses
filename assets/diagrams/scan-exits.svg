<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 448" role="img" aria-label="Side by side: the local exit is a gateway container holding the tunnel with the run's workers sharing its network namespace, built and destroyed with the run; the remote exit is an existing pool of enrolled workers scanning from their own addresses.">
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 12px; fill: #1d1a26; }
  .t-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; }
  .t-muted { fill: #6b6680; font-size: 11px; }  .t-lbl { font-size: 11px; fill: #6b6680; letter-spacing: 0.06em; }
  .bx { fill: #ffffff; stroke: #1d1a26; stroke-width: 1.2; }  .bx-soft { fill: #eeebf3; stroke: #cfcadb; stroke-width: 1; }
  .region { fill: none; stroke: #6b6680; stroke-width: 1; stroke-dasharray: 5 4; }
  .ln { stroke: #1d1a26; stroke-width: 1.4; fill: none; }  .ln-p { stroke: #2f6fd1; stroke-width: 1.8; fill: none; }
  .ln-a { stroke: #c93f78; stroke-width: 1.8; fill: none; }  .ln-x { stroke: #6b6680; stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
  .tag-p { fill: #ffffff; stroke: #2f6fd1; stroke-width: 1.2; }  .tag-a { fill: #ffffff; stroke: #c93f78; stroke-width: 1.2; }
  .tx-p { fill: #2f6fd1; }  .tx-a { fill: #c93f78; }
  .bar-p { fill: #2f6fd1; opacity: 0.85; }  .bar-a { fill: #c93f78; opacity: 0.85; }
  .bar-wait { fill: #e4e0ec; stroke: #6b6680; stroke-width: 1; stroke-dasharray: 4 3; }
  .bar-build { fill: #eeebf3; stroke: #6b6680; stroke-width: 1; }  .bar-down { fill: none; stroke: #6b6680; stroke-width: 1; }
  .guide { stroke: #cfcadb; stroke-width: 1; stroke-dasharray: 2 4; }
  .head { fill: #1d1a26; }  .head-p { fill: #2f6fd1; }  .head-a { fill: #c93f78; }
</style>
      <defs>
        <marker id="h2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><polygon class="head" points="0,0 10,5 0,10"/></marker>
        <marker id="h2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><polygon class="head-a" points="0,0 10,5 0,10"/></marker>
      </defs>

      <!-- LEFT: local -->
      <text class="t-title" x="20" y="24">exit = local</text>
      <text class="t-muted" x="122" y="24">own containers · needs a VPN config</text>

      <rect class="region" x="20" y="44" width="440" height="128" rx="4"/>
      <text class="t-lbl" x="34" y="64">SHARES THE GATEWAY'S NETWORK NAMESPACE</text>
      <rect class="bx" x="34" y="78" width="196" height="76" rx="4"/>
      <text class="t-title" x="48" y="102">worker 0</text>
      <text class="t-muted" x="48" y="122">nmap · chromium · nuclei</text>
      <text class="t-muted" x="48" y="140">no NET_ADMIN, no tun device</text>
      <rect class="bx" x="250" y="78" width="196" height="76" rx="4"/>
      <text class="t-title" x="264" y="102">worker 1</text>
      <text class="t-muted" x="264" y="122">gobuster · httpx · katana</text>
      <text class="t-muted" x="264" y="140">no NET_ADMIN, no tun device</text>

      <path class="ln-a" d="M 240 172 L 240 208" marker-end="url(#h2a)"/>
      <text class="t-muted" x="252" y="194">every packet — one route</text>

      <rect class="bx" x="20" y="208" width="440" height="92" rx="4"/>
      <text class="t-title" x="34" y="232">gateway · vpngw</text>
      <text x="34" y="252">tun0 as default route</text>
      <text class="t-muted" x="34" y="270">holds NET_ADMIN and /dev/net/tun · parses no input</text>
      <text class="t-muted" x="34" y="288">healthy only once its egress ≠ the address before the tunnel</text>

      <path class="ln-a" d="M 240 300 L 240 340" marker-end="url(#h2a)"/>
      <text class="t-muted" x="252" y="324">from the VPN's exit address</text>

      <rect class="bx-soft" x="20" y="340" width="440" height="40" rx="4"/>
      <text x="240" y="365" text-anchor="middle">target</text>

      <text class="t-muted" x="20" y="404">built by the provisioner when the run starts</text>
      <text class="t-muted" x="20" y="420">workers start only once the gateway is healthy</text>
      <text class="t-muted" x="20" y="436">all of it destroyed when the run ends</text>

      <!-- RIGHT: remote -->
      <text class="t-title" x="500" y="24">exit = remote</text>
      <text class="t-muted" x="612" y="24">workers you enrolled · no build step</text>

      <rect class="region" x="500" y="44" width="440" height="128" rx="4"/>
      <text class="t-lbl" x="514" y="64">POOL · remote</text>
      <rect class="bx" x="514" y="78" width="196" height="76" rx="4"/>
      <text class="t-title" x="528" y="102">remote-vps-1</text>
      <text class="t-muted" x="528" y="122">kind vps · approved</text>
      <text class="t-muted" x="528" y="140">connects outbound only</text>
      <rect class="bx" x="730" y="78" width="196" height="76" rx="4"/>
      <text class="t-title" x="744" y="102">remote-vps-2</text>
      <text class="t-muted" x="744" y="122">kind vps · approved</text>
      <text class="t-muted" x="744" y="140">connects outbound only</text>

      <path class="ln-a" d="M 720 172 L 720 340" marker-end="url(#h2a)"/>
      <text class="t-muted" x="732" y="260">from the workers' own addresses</text>

      <rect class="bx-soft" x="500" y="340" width="440" height="40" rx="4"/>
      <text x="720" y="365" text-anchor="middle">target</text>

      <text class="t-muted" x="500" y="404">bound when the run is created</text>
      <text class="t-muted" x="500" y="420">refused if the pool has no active worker</text>
      <text class="t-muted" x="500" y="436">nothing to build, nothing to tear down</text>
    </svg>
