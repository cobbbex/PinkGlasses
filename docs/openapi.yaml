openapi: 3.1.0
info:
  title: PinkGlasses API
  version: "1"
  description: |
    Every route the server registers, generated from the router (go run ./tools/openapi).
    Paths, methods, roles and authentication are exact; request and response bodies are
    described in wiki/API.md rather than typed here. Errors are {"error": "<sentence>"}.
servers:
  - url: /
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: pg_session
    token:
      type: http
      scheme: bearer
      description: An API token, pgt_… — may be narrower than its owner, never wider.
    proxy:
      type: apiKey
      in: header
      name: X-Forwarded-User
      description: Honoured only alongside X-Proxy-Secret when ASM_TRUSTED_PROXY_SECRET is set.
  responses:
    e400:
      description: malformed or missing input
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
    e401:
      description: not signed in, or the credential is no longer valid
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
    e403:
      description: signed in, but the route needs a higher role
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
    e404:
      description: no such thing
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
    e409:
      description: conflicts with state — last administrator, username taken, empty pool
      content:
        application/json:
          schema:
            type: object
            properties:
              error: {type: string}
paths:
  /api/v1/auth/status:
    get:
      operationId: getAuthStatus
      summary: "{setup_required, user?} — whether the install still needs its first administrator, and who you are if signed in"
      x-required-role: public
      security: []
      responses:
        "200": {description: ok}
        "400": {$ref: "#/components/responses/e400"}
        "404": {$ref: "#/components/responses/e404"}
        "409": {$ref: "#/components/responses/e409"}
  /api/v1/auth/setup:
    post:
      operationId: postAuthSetup
      summary: "create the first administrator — {username, display_name, password}; refuses once any account exists"
      x-required-role: public
      security: []
      responses:
        "200": {description: ok}
        "201": {description: created}
        "400": {$ref: "#/components/responses/e400"}
        "404": {$ref: "#/components/responses/e404"}
        "409": {$ref: "#/components/responses/e409"}
  /api/v1/auth/login:
    post:
      operationId: postAuthLogin
      summary: "{username, password} → sets the session cookie, returns {user}"
      x-required-role: public
      security: []
      responses:
        "200": {description: ok}
        "201": {description: created}
        "400": {$ref: "#/components/responses/e400"}
        "404": {$ref: "#/components/responses/e404"}
        "409": {$ref: "#/components/responses/e409"}
  /api/v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: "end this session"
      x-required-role: any
      security:
        - session: []
        - token: []
        - proxy: []
      responses:
        "200": {description: ok}
        "201": {description: created}
        "400": {$ref: "#/components/responses/e400"}
        "401": {$ref: "#/components/responses/e401"}
        "404": {$ref: "#/components/responses/e404"}
        "409": {$ref: "#/components/responses/e409"}
  /api/v1/auth/me:
    get:
      operationId: getAuthMe
      summary: "{user, via, must_change_password}"
      x-required-role: any
      security:
        - session: []
        - token: []
        - proxy: []
      responses:
        "200": {description: ok}
        "400": {$ref: "#/components/responses/e400"}
        "401": {$ref: "#/components/responses/e401"}
        "404": {$ref: "#/components/responses/e404"}
        "409": {$ref: "#/components/responses/e409"}
