        "201": {description: created}
        "400": {$ref: "#/components/responses/e400"}
        "401": {$ref: "#/components/responses/e401"}
        "404": {$ref: "#/components/responses/e404"}
        "409": {$ref: "#/components/responses/e409"}
  /api/v1/scopes:
