# Overrides for the end-to-end test (deploy/e2e/run.sh).
#
# The test runs as its own compose project against its own volumes, so it can
# never touch a real install's database or artifacts: the volume names in the
# main file are pinned, which a different project name alone would not change.
# Only the api and the gateway are published, on the loopback.
services:
  postgres:
    volumes: ["e2e-pgdata:/var/lib/postgresql/data"]
  minio:
    volumes: ["e2e-miniodata:/data"]
  api:
    environment:
      ASM_DEFAULT_ADMIN_PASSWORD: "${E2E_ADMIN_PASSWORD:?set by run.sh}"
      # The test's target is a container on this network, so a private address.
      ASM_ALLOW_PRIVATE_TARGETS: "true"
  scheduler:
    environment:
      ASM_ALLOW_PRIVATE_TARGETS: "true"
      # A short tick: the test waits on the scheduler for every step.
      ASM_SCHED_TICK: "5s"
  worker:
    deploy:
      replicas: 1
    volumes:
      - "e2e-wordlistcache:/var/cache/asm/wordlists"
      - "e2e-spool:/var/cache/asm/spool"

  # What the test scans: one web server on the same network, serving both
  # plain HTTP and HTTPS with a certificate that expires in seven days — so
  # the run has something to identify and something to raise a finding about.
  e2e-target:
    image: nginx:alpine
    restart: unless-stopped
    command:
      - sh
      - -c
      - |
        apk add --no-cache openssl >/dev/null 2>&1
        openssl req -x509 -newkey rsa:2048 -nodes -days 7           -subj "/CN=e2e.test" -keyout /etc/ssl/e2e.key -out /etc/ssl/e2e.crt >/dev/null 2>&1
        printf 'server {\n listen 443 ssl;\n ssl_certificate /etc/ssl/e2e.crt;\n ssl_certificate_key /etc/ssl/e2e.key;\n root /usr/share/nginx/html;\n}\n'           > /etc/nginx/conf.d/tls.conf
        exec nginx -g "daemon off;"

volumes:
  e2e-pgdata:
  e2e-miniodata:
  e2e-wordlistcache:
  e2e-spool:
